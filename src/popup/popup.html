<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-container">
      <h1 id="popup-heading"></h1>
      <div id="popup-control">
        <label id="toggle-label" class="toggle-row">
          <input type="checkbox" id="site-toggle" />
          <span id="site-toggle-text"></span>
        </label>
      </div>
      <p id="popup-status" class="popup-status"></p>
      <p id="popup-hint" class="popup-hint"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
